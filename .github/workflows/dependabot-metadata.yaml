name: Dependabot fetch metadata
on: pull_request

permissions:
  contents: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      - name: "Checkout the referenced branch"
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Dependabot metadata
        id: dependabot-metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      - name: Set git user
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
      - name: Update PR
        env:
          DEPENDENCY_NAMES: ${{ steps.dependabot-metadata.outputs.dependency-names }}
          NEW_VERSION: ${{ steps.dependabot-metadata.outputs.new-version }}
          PREVIOUS_VERSION: ${{ steps.dependabot-metadata.outputs.previous-version }}
        run: |
          if [[ "$DEPENDENCY_NAMES" == *"openai"* ]]; then
            sed -i \
              "s/$PREVIOUS_VERSION/$NEW_VERSION/g" \
              "${{ github.workspace }}/custom_components/azure_openai_conversation/manifest.json"
          fi

          git add "${{ github.workspace }}/custom_components/azure_openai_conversation/manifest.json"
          if git diff --cached --quiet; then
            echo "No manifest update needed"
            exit 0
          fi

          git commit -m "Updated openai dependency in manifest.json to $NEW_VERSION"
          git push
