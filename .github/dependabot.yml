# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Dependabot should not update Home Assistant as that should match the homeassistant key in hacs.json
      - dependency-name: "homeassistant"
      # The openai floor must not exceed the version pinned in Home Assistant core's homeassistant/package_constraints.txt
      # for the homeassistant key in hacs.json, or Home Assistant cannot install the integration, so bump it together
      # with Home Assistant. update-types do not apply to version ranges, hence the bare ignore; security updates are
      # still raised
      - dependency-name: "openai"
      # Test dependencies must match Home Assistant core's homeassistant/package_constraints.txt for the targeted
      # Home Assistant release, so bump them together with Home Assistant; security updates are still raised
      - dependency-name: "gazetteer-matcher"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "hassil"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "home-assistant-intents"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "PyTurboJPEG"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "mutagen"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "ha-ffmpeg"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
